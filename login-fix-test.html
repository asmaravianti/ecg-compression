<!DOCTYPE html>
<html>
<head>
    <title>Login Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .step { background: #e9ecef; padding: 15px; margin: 10px 0; border-radius: 5px; border-left: 4px solid #007bff; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; margin: 8px; cursor: pointer; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .info { background: #d1ecf1; color: #0c5460; padding: 15px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Login Fix Test</h1>

        <div class="step">
            <h3>Step 1: Clear All Data</h3>
            <button onclick="clearAll()">Clear All Data</button>
            <div id="clearResult"></div>
        </div>

        <div class="step">
            <h3>Step 2: Login Test</h3>
            <button onclick="testLogin()">Test Login (QuickTestUser)</button>
            <div id="loginResult"></div>
        </div>

        <div class="step">
            <h3>Step 3: Check Team Page</h3>
            <button onclick="checkTeamPage()">Open Team Page</button>
            <div id="teamResult"></div>
        </div>

        <div class="step">
            <h3>🎯 Quick Links</h3>
            <button onclick="window.open('index.html', '_blank')">Open Main Site</button>
            <button onclick="window.open('team.html', '_blank')">Open Team Page</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            element.appendChild(div);
        }

        function clearLog(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        function clearAll() {
            clearLog('clearResult');

            // Clear all localStorage
            localStorage.clear();
            sessionStorage.clear();

            log('clearResult', '✅ All data cleared successfully!', 'success');
            log('clearResult', '📋 Cleared: jwt_token, authToken, currentTeam, submissions, highScore', 'info');
        }

        async function testLogin() {
            clearLog('loginResult');

            log('loginResult', '🔐 Testing login with QuickTestUser...', 'info');

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        team_name: 'QuickTestUser',
                        password: '123456'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Store tokens like the main app does
                    localStorage.setItem('jwt_token', data.token);
                    localStorage.setItem('currentTeam', data.teamName);

                    log('loginResult', `✅ Login successful!`, 'success');
                    log('loginResult', `🔑 Token stored: ${data.token.substring(0, 20)}...`, 'info');
                    log('loginResult', `👤 Team: ${data.teamName}`, 'info');

                    // Verify storage
                    const storedToken = localStorage.getItem('jwt_token');
                    const storedTeam = localStorage.getItem('currentTeam');

                    log('loginResult', `📦 Verification - Token: ${!!storedToken}, Team: ${storedTeam}`, 'info');
                } else {
                    log('loginResult', `❌ Login failed: ${data.message}`, 'error');
                }
            } catch (error) {
                log('loginResult', `❌ Login error: ${error.message}`, 'error');
            }
        }

        function checkTeamPage() {
            clearLog('teamResult');

            // Check current storage state
            const token = localStorage.getItem('jwt_token') || localStorage.getItem('authToken');
            const currentTeam = localStorage.getItem('currentTeam');

            log('teamResult', '🔍 Checking current authentication state...', 'info');
            log('teamResult', `🔑 Token exists: ${!!token}`, token ? 'success' : 'error');
            log('teamResult', `👤 Team set: ${currentTeam || 'None'}`, currentTeam ? 'success' : 'error');

            if (token && currentTeam) {
                log('teamResult', '✅ Authentication looks good! Opening team page...', 'success');

                // Open team page in new tab
                setTimeout(() => {
                    window.open('team.html', '_blank');
                    log('teamResult', '📄 Team page opened in new tab. Check if it loads correctly!', 'info');
                }, 1000);
            } else {
                log('teamResult', '❌ Authentication incomplete. Please login first.', 'error');
            }
        }
    </script>
</body>
</html>
