<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - ECG Compression</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>ECG Compression API Test</h1>

    <div class="test-section">
        <h3>1. Basic Server Test</h3>
        <button onclick="testBasicConnection()">Test Basic Connection</button>
        <div id="basic-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2. Debug Info Test</h3>
        <button onclick="testDebugInfo()">Test Debug Info</button>
        <div id="debug-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3. Registration Test</h3>
        <input type="text" id="testTeam" placeholder="Test Team Name" value="TestTeam123">
        <input type="email" id="testEmail" placeholder="test@example.com" value="test@example.com">
        <input type="password" id="testPassword" placeholder="password" value="testpass123">
        <button onclick="testRegistration()">Test Registration</button>
        <div id="register-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>4. Login Test</h3>
        <button onclick="testLogin()">Test Login (use registered credentials)</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>5. Leaderboard Test (requires login)</h3>
        <button onclick="testLeaderboard()">Test Leaderboard</button>
        <div id="leaderboard-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>6. Codabench Connection Test</h3>
        <button onclick="testCodabench()">Test Codabench API</button>
        <div id="codabench-result" class="result"></div>
    </div>

    <script>
        const API_BASE = `${window.location.protocol}//${window.location.host}/api`;
        let authToken = null;

        function showResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.innerHTML = message;
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
        }

        async function testBasicConnection() {
            try {
                const response = await fetch(`${window.location.protocol}//${window.location.host}/`);
                const text = await response.text();
                showResult('basic-result', `✅ Server is running on port ${window.location.port}!<br><pre>${text}</pre>`);
            } catch (error) {
                showResult('basic-result', `❌ Server connection failed: ${error.message}`, false);
            }
        }

        async function testDebugInfo() {
            try {
                const response = await fetch(`${API_BASE}/debug-info`);
                const data = await response.json();
                showResult('debug-result', `✅ Debug info retrieved:<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                showResult('debug-result', `❌ Debug info failed: ${error.message}`, false);
            }
        }

        async function testRegistration() {
            const teamName = document.getElementById('testTeam').value;
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teamName, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('register-result', `✅ Registration successful:<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
                } else {
                    showResult('register-result', `⚠️ Registration response:<br><pre>${JSON.stringify(data, null, 2)}</pre>`, false);
                }
            } catch (error) {
                showResult('register-result', `❌ Registration failed: ${error.message}`, false);
            }
        }

        async function testLogin() {
            const teamName = document.getElementById('testTeam').value;
            const password = document.getElementById('testPassword').value;

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ team_name: teamName, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    authToken = data.token;
                    showResult('login-result', `✅ Login successful! Token: ${data.token.substring(0, 20)}...<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
                } else {
                    showResult('login-result', `❌ Login failed:<br><pre>${JSON.stringify(data, null, 2)}</pre>`, false);
                }
            } catch (error) {
                showResult('login-result', `❌ Login failed: ${error.message}`, false);
            }
        }

        async function testLeaderboard() {
            if (!authToken) {
                showResult('leaderboard-result', '❌ Please login first!', false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/leaderboard`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('leaderboard-result', `✅ Leaderboard retrieved:<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
                } else {
                    showResult('leaderboard-result', `❌ Leaderboard failed:<br><pre>${JSON.stringify(data, null, 2)}</pre>`, false);
                }
            } catch (error) {
                showResult('leaderboard-result', `❌ Leaderboard failed: ${error.message}`, false);
            }
        }

        async function testCodabench() {
            if (!authToken) {
                showResult('codabench-result', '❌ Please login first!', false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/test-codabench`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('codabench-result', `✅ Codabench test successful:<br><pre>${JSON.stringify(data, null, 2)}</pre>`);
                } else {
                    showResult('codabench-result', `❌ Codabench test failed:<br><pre>${JSON.stringify(data, null, 2)}</pre>`, false);
                }
            } catch (error) {
                showResult('codabench-result', `❌ Codabench test failed: ${error.message}`, false);
            }
        }

        // Auto-test basic connection on page load
        window.onload = () => {
            testBasicConnection();
        };
    </script>
</body>
</html>
