<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG Server Port Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .testing { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>ECG Compression Server - Port Detection</h1>

    <div id="status" class="status testing">
        🔍 Testing server connectivity...
    </div>

    <div>
        <button onclick="testAllPorts()">Test All Ports</button>
        <button onclick="openFoundServer()">Open Server</button>
    </div>

    <div id="details"></div>

    <script>
        let serverPort = null;

        async function testPort(port) {
            try {
                const response = await fetch(`http://localhost:${port}/api/status`, {
                    method: 'GET',
                    timeout: 3000
                });

                if (response.ok) {
                    const data = await response.json();
                    return { success: true, port, data };
                }
            } catch (error) {
                return { success: false, port, error: error.message };
            }
            return { success: false, port };
        }

        async function testAllPorts() {
            const statusDiv = document.getElementById('status');
            const detailsDiv = document.getElementById('details');

            statusDiv.innerHTML = '🔍 Testing ports 3000-3010...';
            statusDiv.className = 'status testing';

            const portsToTest = Array.from({length: 11}, (_, i) => 3000 + i);
            const results = [];

            for (const port of portsToTest) {
                const result = await testPort(port);
                results.push(result);

                if (result.success) {
                    serverPort = port;
                    statusDiv.innerHTML = `✅ Server found on port ${port}!`;
                    statusDiv.className = 'status success';

                    detailsDiv.innerHTML = `
                        <h3>Server Details (Port ${port}):</h3>
                        <pre>${JSON.stringify(result.data, null, 2)}</pre>
                        <p><strong>Available URLs:</strong></p>
                        <ul>
                            <li><a href="http://localhost:${port}/index.html" target="_blank">Main Page</a></li>
                            <li><a href="http://localhost:${port}/team.html" target="_blank">Team Page</a></li>
                            <li><a href="http://localhost:${port}/api-test.html" target="_blank">API Test</a></li>
                        </ul>
                    `;
                    return;
                }
            }

            statusDiv.innerHTML = '❌ No server found on ports 3000-3010';
            statusDiv.className = 'status error';
            detailsDiv.innerHTML = '<p>Please start the server using: <code>node start-server.js</code></p>';
        }

        function openFoundServer() {
            if (serverPort) {
                window.open(`http://localhost:${serverPort}/index.html`, '_blank');
            } else {
                alert('Please test ports first to find the server!');
            }
        }

        // Auto-test on page load
        window.onload = testAllPorts;
    </script>
</body>
</html>
